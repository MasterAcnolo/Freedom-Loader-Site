<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
      const legacyHost = 'masteracnolo.github.io';
      const destination = 'https://freedomloader.acnolo.fr';
      const legacyBase = '/Freedom-Loader-Site';
      const isLegacyBase = window.location.pathname === legacyBase
        || window.location.pathname.startsWith(`${legacyBase}/`);
      const path = isLegacyBase
        ? window.location.pathname.slice(legacyBase.length) || '/'
        : window.location.pathname;

      if (window.location.hostname === legacyHost) {
        window.location.replace(
          `${destination}${path}${window.location.search}${window.location.hash}`
        );
      } else if (path !== '/') {
        window.location.replace(
          `/#${path}${window.location.search}${window.location.hash}`
        );
      }
    </script>
  </head>
  <body>
  </body>
</html>
